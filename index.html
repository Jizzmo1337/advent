<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventskalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script id="kalender-daten" type="application/json">{"titel":"Amis Adventskalender ♥️","untertitel":"☃️ Jeden Tag ein Türchen ❄️","jahr":2026,"bilder":{}}</script>
<script>
  const DATEN = JSON.parse(document.getElementById("kalender-daten").textContent);
  const CONFIG = {
    titel: DATEN.titel,
    untertitel: DATEN.untertitel,
    jahr: DATEN.jahr,
    bildPfad: (tag) => (DATEN.bilder && DATEN.bilder[tag]) || "",
    reihenfolge: [7, 18, 3, 22, 12, 1, 15, 9, 24, 5, 20, 11, 2, 16, 13, 8, 21, 4, 19, 10, 6, 23, 14, 17],
    gesperrtText: (tage) => tage === 1 ? "Noch 1 Tag Geduld 🤍" : `Noch ${tage} Tage Geduld 🤍`
  };
</script>
<style>
  :root {
    --nacht: #0f1a24;
    --nacht-2: #172634;
    --tuer: #b23a32;
    --tuer-dunkel: #8e2a24;
    --tuer-gruen: #2f5a45;
    --tuer-gruen-dunkel: #234434;
    --creme: #f6eedf;
    --gold: #d9b26f;
    --text: #f6eedf;
    --text-leise: rgba(246, 238, 223, 0.65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #24394b 0%, var(--nacht) 60%) fixed;
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Schnee */
  #schnee { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  main {
    position: relative; z-index: 1;
    max-width: 920px; margin: 0 auto;
    padding: 48px 16px 64px;
  }
  header { text-align: center; margin-bottom: 32px; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 46px);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  header p { margin-top: 10px; color: var(--text-leise); font-size: 15px; }
  .vorschau-hinweis {
    display: inline-block; margin-top: 14px; padding: 6px 12px;
    border: 1px solid var(--gold); border-radius: 99px;
    color: var(--gold); font-size: 12px; letter-spacing: 0.04em;
  }

  .raster {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (min-width: 640px) { .raster { grid-template-columns: repeat(6, 1fr); gap: 14px; } }

  .feld {
    position: relative;
    aspect-ratio: 3 / 4;
    perspective: 900px;
    border-radius: 10px;
    cursor: pointer;
  }

  /* Was hinter der Tür liegt */
  .dahinter {
    position: absolute; inset: 0;
    border-radius: 10px;
    background: #0a1219;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5), inset 0 6px 18px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .dahinter img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.6s ease 0.35s;
  }
  .feld.offen .dahinter img { opacity: 1; }

  /* Die Tür selbst */
  .tuer {
    position: absolute; inset: 0;
    border-radius: 10px;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.6, 0.05, 0.25, 1);
    z-index: 2;
  }
  .tuer-vorne, .tuer-hinten {
    position: absolute; inset: 0;
    border-radius: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .tuer-vorne {
    background: linear-gradient(155deg, var(--tuer) 0%, var(--tuer-dunkel) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .feld.gruen .tuer-vorne { background: linear-gradient(155deg, var(--tuer-gruen) 0%, var(--tuer-gruen-dunkel) 100%); }
  .feld.creme .tuer-vorne { background: linear-gradient(155deg, #efe3cc 0%, #dccaa8 100%); }
  .feld.creme .zahl { color: var(--tuer-dunkel); }
  .tuer-vorne::before {
    content: ""; position: absolute; inset: 6px;
    border: 1px dashed rgba(255,255,255,0.22);
    border-radius: 6px;
  }
  .feld.creme .tuer-vorne::before { border-color: rgba(142,42,36,0.25); }
  .tuer-vorne::after { /* Knauf */
    content: ""; position: absolute; right: 9px; top: 50%;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .tuer-hinten {
    background: linear-gradient(155deg, #e9dcc3, #cdb991);
    transform: rotateY(180deg);
  }
  .zahl {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(26px, 7vw, 40px);
    color: var(--creme);
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    position: relative;
  }
  .feld.offen .tuer { transform: rotateY(-108deg); }
  .feld.offen .tuer-vorne { box-shadow: none; }

  .feld.heute .tuer-vorne { box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(217,178,111,0.45); }
  .feld.gesperrt .tuer-vorne { filter: saturate(0.75) brightness(0.88); }
  .feld.wackeln .tuer { animation: wackeln 0.45s ease; }
  @keyframes wackeln {
    0%, 100% { transform: rotateY(0); }
    25% { transform: rotateY(-9deg); }
    50% { transform: rotateY(0); }
    75% { transform: rotateY(-5deg); }
  }
  .feld:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* Hinweis bei gesperrten Türen */
  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 30;
    transform: translate(-50%, 20px);
    background: var(--creme); color: var(--nacht);
    padding: 12px 20px; border-radius: 99px;
    font-size: 15px; font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.sichtbar { opacity: 1; transform: translate(-50%, 0); }

  /* Großansicht */
  .gross {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(6, 11, 16, 0.88);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .gross.sichtbar { opacity: 1; pointer-events: auto; }
  .gross figure {
    max-width: min(92vw, 640px);
    transform: scale(0.85) translateY(16px);
    transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  .gross.sichtbar figure { transform: scale(1) translateY(0); }
  .gross img {
    display: block; max-width: 100%; max-height: 78vh;
    border-radius: 8px;
    background: var(--creme);
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .gross figcaption {
    text-align: center; margin-top: 16px;
    font-family: "Fraunces", Georgia, serif; font-size: 18px; color: var(--creme);
  }
  .schliessen {
    position: absolute; top: 16px; right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    border: none; background: rgba(246,238,223,0.12); color: var(--creme);
    font-size: 22px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .tuer, .gross, .gross figure, .dahinter img { transition: none; }
    .feld.wackeln .tuer { animation: none; }
  }
</style>
</head>
<body>
<canvas id="schnee"></canvas>

<main>
  <header>
    <h1 id="titel"></h1>
    <p id="untertitel"></p>
    <div id="vorschau" class="vorschau-hinweis" hidden>Vorschau-Modus · alle Türchen offen</div>
  </header>
  <div class="raster" id="raster"></div>
</main>

<div class="gross" id="gross" aria-hidden="true">
  <button class="schliessen" id="schliessen" aria-label="Schließen">✕</button>
  <figure>
    <img id="grossBild" alt="">
    <figcaption id="grossText"></figcaption>
  </figure>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  // Vorschau: Adresse mit #vorschau öffnen → alle Türchen sind offen (nur zum Testen)
  let vorschau = location.hash === "#vorschau" || window.__VORSCHAU === true;
  const SPEICHER = "adventskalender-" + CONFIG.jahr;

  document.getElementById("titel").textContent = CONFIG.titel;
  document.getElementById("untertitel").textContent = CONFIG.untertitel;
  // Geheimer Test-Schalter: 5× schnell auf die Überschrift tippen
  let tipps = 0, tippTimer;
  document.getElementById("titel").addEventListener("click", () => {
    tipps++; clearTimeout(tippTimer);
    tippTimer = setTimeout(() => tipps = 0, 1200);
    if (tipps >= 5) { tipps = 0; vorschau = !vorschau; aufbauen(); }
  });

  function geoeffnetLaden() {
    try { return new Set(JSON.parse(localStorage.getItem(SPEICHER) || "[]")); }
    catch (e) { return new Set(); }
  }
  function geoeffnetSpeichern(set) {
    try { localStorage.setItem(SPEICHER, JSON.stringify([...set])); } catch (e) {}
  }
  const geoeffnet = geoeffnetLaden();

  function heute() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function datumVon(tag) { return new Date(CONFIG.jahr, 11, tag); }
  function istFrei(tag) { return vorschau || heute() >= datumVon(tag); }
  function tageBis(tag) { return Math.round((datumVon(tag) - heute()) / 86400000); }

  // Platzhalter, falls ein Bild noch fehlt
  function platzhalter(tag) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
      <rect width="600" height="800" fill="#f6eedf"/>
      <text x="300" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="140" fill="#b23a32">${tag}</text>
      <text x="300" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#8e2a24" opacity="0.7">Hier kommt dein Bild hin</text>
    </svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  const farben = ["", "gruen", "creme", "", "gruen", "", "creme", "gruen"];
  const raster = document.getElementById("raster");
  const heuteTag = (new Date().getMonth() === 11 && new Date().getFullYear() === CONFIG.jahr) ? new Date().getDate() : null;

  function aufbauen() {
  document.getElementById("vorschau").hidden = !vorschau;
  raster.innerHTML = "";
  CONFIG.reihenfolge.forEach((tag, i) => {
    const feld = document.createElement("div");
    feld.className = "feld " + farben[i % farben.length];
    feld.tabIndex = 0;
    feld.setAttribute("role", "button");
    feld.setAttribute("aria-label", "Türchen " + tag);
    if (tag === heuteTag) feld.classList.add("heute");
    if (!istFrei(tag)) feld.classList.add("gesperrt");

    feld.innerHTML = `
      <div class="dahinter"><img alt="" loading="lazy"></div>
      <div class="tuer">
        <div class="tuer-vorne"><span class="zahl">${tag}</span></div>
        <div class="tuer-hinten"></div>
      </div>`;

    const img = feld.querySelector(".dahinter img");
    img.onerror = () => { img.onerror = null; img.src = platzhalter(tag); };

    if (istFrei(tag) && geoeffnet.has(tag)) {
      img.src = CONFIG.bildPfad(tag) || platzhalter(tag);
      feld.classList.add("offen");
    }

    const klick = () => oeffnen(feld, tag, img);
    feld.addEventListener("click", klick);
    feld.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); klick(); } });
    raster.appendChild(feld);
  });
  }
  aufbauen();

  let toastTimer;
  function toast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("sichtbar");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("sichtbar"), 2200);
  }

  function oeffnen(feld, tag, img) {
    if (!istFrei(tag)) {
      feld.classList.remove("wackeln");
      void feld.offsetWidth;
      feld.classList.add("wackeln");
      toast(CONFIG.gesperrtText(tageBis(tag)));
      return;
    }
    if (feld.classList.contains("offen")) { gross(tag, img.src); return; }

    if (!img.getAttribute("src")) img.src = CONFIG.bildPfad(tag) || platzhalter(tag);
    feld.classList.add("offen");
    geoeffnet.add(tag);
    geoeffnetSpeichern(geoeffnet);
    setTimeout(() => gross(tag, img.src), 1000);
  }

  const grossEl = document.getElementById("gross");
  function gross(tag, src) {
    document.getElementById("grossBild").src = src;
    document.getElementById("grossText").textContent = tag + ". Dezember";
    grossEl.classList.add("sichtbar");
    grossEl.setAttribute("aria-hidden", "false");
  }
  function zu() { grossEl.classList.remove("sichtbar"); grossEl.setAttribute("aria-hidden", "true"); }
  document.getElementById("schliessen").addEventListener("click", zu);
  grossEl.addEventListener("click", (e) => { if (e.target === grossEl) zu(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") zu(); });

  // Schneefall: große Flocken + viele kleine Flöckchen
  const c = document.getElementById("schnee");
  const ctx = c.getContext("2d");
  let flocken = [];
  function flocke(dpr, klein, zufallY) {
    return {
      x: Math.random() * c.width,
      y: zufallY ? Math.random() * c.height : -10,
      r: (klein ? Math.random() * 0.7 + 0.35 : Math.random() * 2.2 + 1.1) * dpr,
      v: (klein ? Math.random() * 0.45 + 0.35 : Math.random() * 0.8 + 0.5) * dpr,
      w: Math.random() * Math.PI * 2,
      ws: Math.random() * 0.015 + 0.006,
      a: klein ? Math.random() * 0.35 + 0.35 : Math.random() * 0.3 + 0.6,
      klein
    };
  }
  function groesse() {
    const dpr = devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    const gross = Math.min(110, Math.round(innerWidth / 9));
    const klein = Math.min(260, Math.round(innerWidth / 3.5));
    flocken = [];
    for (let i = 0; i < gross; i++) flocken.push(flocke(dpr, false, true));
    for (let i = 0; i < klein; i++) flocken.push(flocke(dpr, true, true));
  }
  function schneien() {
    const dpr = devicePixelRatio || 1;
    ctx.clearRect(0, 0, c.width, c.height);
    for (const f of flocken) {
      f.y += f.v; f.w += f.ws; f.x += Math.sin(f.w) * (f.klein ? 0.25 : 0.45) * dpr;
      if (f.y > c.height + 5) Object.assign(f, flocke(dpr, f.klein, false));
      ctx.globalAlpha = f.a;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(schneien);
  }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    groesse(); addEventListener("resize", groesse); schneien();
  }
})();
</script>
</body>
</html>
